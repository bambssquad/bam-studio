<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Berbicara — lyric video</title>
</head>
<body>
  <div id="wrap">
    <div id="stage">
      <canvas id="gl" width="1080" height="1920"></canvas>
      <div id="title"><div class="word">Berbicara</div><div class="sub">SAYOE</div></div>
      <div id="strip">
        <div id="lyr">
          <div class="meta"><span class="label"></span><span class="tc-wrap"><i class="dot"></i><span class="tc"></span></span></div>
          <div class="slot"></div>
          <div class="next"></div>
          <div class="bar"></div>
        </div>
      </div>
    </div>
    <div id="ctrl">
      <button id="play" aria-label="Putar">Putar</button>
      <input id="scrub" type="range" min="0" max="219" step="0.01" value="0" aria-label="Posisi" />
      <span id="time">00:00</span>
    </div>
  </div>
  <audio id="audio" src="./berbicara.mp3" preload="auto"></audio>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
